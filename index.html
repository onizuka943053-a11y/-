<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>擠一擠</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="擠一擠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#EEF1F4; --ink:#101820; --mute:#5B6773; --line:#D3DAE1; --card:#FFFFFF;
  --accent:#2F4BFF; --accent-ink:#FFFFFF; --good:#0E8A5F;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1319; --ink:#EAF0F5; --mute:#93A0AD; --line:#26303A; --card:#171E26; --accent:#6C82FF; --accent-ink:#0E1319; --good:#3DD6A0;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
  min-height:100vh;
}
main{max-width:560px;margin:0 auto;padding:20px 18px}
h1{font-size:30px;letter-spacing:.04em;margin:8px 0 2px;font-weight:800}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.pick{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:30px 16px;border:2px dashed var(--accent);border-radius:var(--r);
  background:var(--card);color:var(--accent);font-size:18px;font-weight:700;cursor:pointer;
}
.pick small{color:var(--mute);font-weight:400;font-size:13px}
.pick input{display:none}
.panel{background:var(--card);border-radius:var(--r);padding:16px;margin-top:16px;border:1px solid var(--line)}
.panel h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levels button{
  padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;line-height:1.3;
}
.levels button small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.levels button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.levels button[aria-pressed=true] small{color:inherit;opacity:.85}
.target{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.target input{
  width:90px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);
  background:transparent;color:var(--ink);font:inherit;
}
.target span{color:var(--mute)}
.go{
  width:100%;margin-top:16px;padding:15px;border:0;border-radius:var(--r);
  background:var(--accent);color:var(--accent-ink);font:inherit;font-size:17px;font-weight:700;
}
.go:disabled{opacity:.4}
.summary{display:none;margin-top:18px;text-align:center}
.summary.on{display:block}
.big{font-size:64px;line-height:1;font-weight:800;color:var(--good);letter-spacing:-.02em}
.big small{font-size:28px}
.summary p{margin:6px 0 0;color:var(--mute);font-size:14px}
.saveall{
  width:100%;margin-top:12px;padding:13px;border-radius:var(--r);border:1.5px solid var(--accent);
  background:transparent;color:var(--accent);font:inherit;font-weight:700;
}
.list{margin-top:14px;display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--line);flex:none}
.meta{flex:1;min-width:0;font-size:13px}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.meta .sz{color:var(--mute)}
.meta .sz em{font-style:normal;color:var(--good);font-weight:700}
.item button{
  flex:none;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;
}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{color:var(--mute);font-size:12px;margin-top:18px;text-align:center}
.err{color:#C43D3D;font-size:13px}
button:focus-visible,.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>擠一擠</h1>
  <p class="sub">照片直接在手機裡壓縮,不會上傳到任何地方。</p>

  <label class="pick">
    <input id="file" type="file" accept="image/*" multiple>
    <span id="pickText">選擇照片</span>
    <small>可一次選很多張</small>
  </label>

  <section class="panel">
    <h2>壓縮程度</h2>
    <div class="levels" id="levels">
      <button data-i="0" aria-pressed="false">標準<small>長邊 2048</small></button>
      <button data-i="1" aria-pressed="false">強力<small>長邊 1280</small></button>
      <button data-i="2" aria-pressed="true">極限<small>長邊 800</small></button>
      <button data-i="3" aria-pressed="false">超極限<small>長邊 480</small></button>
    </div>
    <div class="target">
      <span>或指定每張不超過</span>
      <input id="kb" type="number" inputmode="numeric" min="5" placeholder="例如 100">
      <span>KB</span>
    </div>
    <button class="go" id="go" disabled>開始壓縮</button>
  </section>

  <section class="summary" id="summary">
    <div class="big" id="pct">0<small>%</small></div>
    <p id="sumText"></p>
    <button class="saveall" id="saveAll">全部儲存</button>
  </section>

  <div class="list" id="list"></div>
  <p class="note">輸出為 JPEG,會移除 GPS 等照片資訊。<br>儲存時在分享選單選「儲存影像」就會進相簿。</p>
</main>

<script>
const LEVELS = [
  {max:2048, q:0.80},
  {max:1280, q:0.70},
  {max:800,  q:0.55},
  {max:480,  q:0.45}
];
let level = 2, files = [], results = [];

const $ = id => document.getElementById(id);
const fmt = n => n >= 1048576 ? (n/1048576).toFixed(2)+" MB" : Math.max(1,Math.round(n/1024))+" KB";

document.querySelectorAll("#levels button").forEach(b=>{
  b.onclick=()=>{
    level=+b.dataset.i;
    document.querySelectorAll("#levels button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  };
});

$("file").onchange = e => {
  files = [...e.target.files];
  results = [];
  $("list").innerHTML = ""; $("summary").classList.remove("on");
  $("go").disabled = !files.length;
  $("pickText").textContent = files.length ? `已選 ${files.length} 張` : "選擇照片";
};

async function load(file){
  try { return await createImageBitmap(file); }
  catch(_){
    return await new Promise((res,rej)=>{
      const u=URL.createObjectURL(file), im=new Image();
      im.onload=()=>res(im); im.onerror=rej; im.src=u;
    });
  }
}
const toBlob = (c,q) => new Promise(r=>c.toBlob(r,"image/jpeg",q));

function draw(img, scale){
  const sw = img.width||img.naturalWidth, sh = img.height||img.naturalHeight;
  const w = Math.max(1,Math.round(sw*scale));
  const h = Math.max(1,Math.round(sh*scale));
  // 分段縮小(每次最多縮一半),比一次縮到位更銳利、不易鋸齒
  let src = img, cw = sw, ch = sh;
  while(cw/2 > w){
    const nw=Math.round(cw/2), nh=Math.round(ch/2);
    const t=document.createElement("canvas"); t.width=nw; t.height=nh;
    const tx=t.getContext("2d"); tx.imageSmoothingQuality="high"; tx.drawImage(src,0,0,nw,nh);
    src=t; cw=nw; ch=nh;
  }
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  const x = c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,w,h);
  x.imageSmoothingQuality="high";
  x.drawImage(src,0,0,w,h);
  return c;
}

async function compress(file, targetKB){
  const img = await load(file);
  const W = img.width||img.naturalWidth, H = img.height||img.naturalHeight;
  const L = LEVELS[level];
  let scale = Math.min(1, L.max/Math.max(W,H));

  if(!targetKB){
    return await toBlob(draw(img,scale), L.q);
  }
  const limit = targetKB*1024;
  // 目標大小模式:畫質固定在 0.6 以上,檔案太大就「縮小尺寸」而不是壓爛畫質
  scale = Math.min(1, 2048/Math.max(W,H));
  for(let round=0; round<20; round++){
    const c = draw(img, scale);
    let lo=0.6, hi=0.92, best=await toBlob(c,lo);
    if(best.size<=limit){
      for(let i=0;i<6;i++){
        const mid=(lo+hi)/2, bl=await toBlob(c,mid);
        if(bl.size<=limit){best=bl; lo=mid;} else hi=mid;
      }
      return best;
    }
    scale*=0.85;
  }
  return await toBlob(draw(img,scale),0.6);
}

$("go").onclick = async () => {
  const btn=$("go"); btn.disabled=true;
  const targetKB = +$("kb").value || 0;
  results=[]; $("list").innerHTML="";
  let origTotal=0, newTotal=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    btn.textContent=`壓縮中 ${i+1} / ${files.length}`;
    const row=document.createElement("div"); row.className="item";
    row.innerHTML=`<img alt=""><div class="meta"><b></b><div class="sz">處理中…</div><div class="bar"><i></i></div></div>`;
    row.querySelector("b").textContent=f.name;
    $("list").appendChild(row);
    try{
      const blob=await compress(f,targetKB);
      const base=f.name.replace(/\.[^.]+$/,"");
      const out=new File([blob],`${base}-small.jpg`,{type:"image/jpeg"});
      results.push(out);
      origTotal+=f.size; newTotal+=out.size;
      const url=URL.createObjectURL(out);
      row.querySelector("img").src=url;
      const pct=Math.max(0,Math.round((1-out.size/f.size)*100));
      row.querySelector(".sz").innerHTML=`${fmt(f.size)} → ${fmt(out.size)} <em>-${pct}%</em>`;
      row.querySelector(".bar").remove();
      const sb=document.createElement("button"); sb.textContent="儲存";
      sb.onclick=()=>save([out]); row.appendChild(sb);
    }catch(err){
      row.querySelector(".sz").innerHTML=`<span class="err">這張讀不了,請換一張</span>`;
    }
  }
  if(results.length){
    const pct=Math.max(0,Math.round((1-newTotal/origTotal)*100));
    $("pct").innerHTML=`${pct}<small>%</small>`;
    $("sumText").textContent=`共 ${results.length} 張,${fmt(origTotal)} → ${fmt(newTotal)}`;
    $("summary").classList.add("on");
  }
  btn.textContent="開始壓縮"; btn.disabled=false;
};

async function save(list){
  try{
    if(navigator.canShare && navigator.canShare({files:list})){
      await navigator.share({files:list});
      return;
    }
  }catch(e){ if(e.name==="AbortError") return; }
  for(const f of list){
    const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
}
$("saveAll").onclick=()=>results.length&&save(results);

if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
